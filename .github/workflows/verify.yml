name: Navigator compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolated contracts (no dependency install)
        run: |
          node --experimental-strip-types scripts/chat-source.mjs
          node --experimental-strip-types scripts/navigation-contract.mjs

  build-and-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - name: Install the committed dependency baseline
        run: pnpm install --frozen-lockfile
      - name: Build, typecheck and run all regression tests
        run: pnpm verify
      - name: Ensure verification does not rewrite the dependency lock
        run: git diff --exit-code -- pnpm-lock.yaml
