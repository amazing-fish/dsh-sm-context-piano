# sm-context-piano bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-sm-context-piano`.
#
# The row loads the package's browser face through `dsh.client`. The host face
# exports the plugin Config schema (DSH 0.1.7 settings contract); this
# navigator never alters sessions, system prompts, or the model context.
#
# The entry id doubles as the settings entry id under the 0.1.7 settings
# contract, so it stays aligned with the former settings namespace
# ("sm-context-piano") for DSH migration.
- insert:
    - id: sm-context-piano
      name: '@hjj345345/dsh-sm-context-piano'
